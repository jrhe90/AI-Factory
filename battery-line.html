<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prismatic Module &amp; Pack Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<style>
/* Layout: full-bleed 3D line, floating control bar on top, station board docked right (bottom sheet on phones) */
:root {
  --panel: rgba(255, 255, 255, 0.9);
  --panel-solid: #ffffff;
  --ink: #18202b;
  --muted: #5d6877;
  --line: #dde2e8;
  --accent: #e8930c;
  --accent-ink: #1a1306;
  --chip: #eef1f4;
  --ok: #1f9d55;
  --warn: #d99a00;
  --idle: #98a3b1;
  --scene: #f3f4f6;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(22, 27, 34, 0.9); --panel-solid: #161b22; --ink: #e8edf3; --muted: #9aa6b4; --line: #2c3540;
    --accent: #f5a524; --accent-ink: #1a1306; --chip: #222a34; --idle: #6b7787; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(22, 27, 34, 0.9); --panel-solid: #161b22; --ink: #e8edf3; --muted: #9aa6b4; --line: #2c3540;
  --accent: #f5a524; --accent-ink: #1a1306; --chip: #222a34; --idle: #6b7787; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--scene); color: var(--ink); font: 14px/1.4 var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.tag {
  font: 600 11px/1 var(--sans); color: #18202b; background: rgba(255, 255, 255, 0.92); border: 1px solid #d5dae0;
  padding: 4px 7px; border-radius: 4px; white-space: nowrap; display: flex; gap: 6px; align-items: center;
}
.tag i { width: 7px; height: 7px; border-radius: 50%; background: #98a3b1; }
.tag[data-s="busy"] i { background: #1f9d55; }
.tag[data-s="blocked"] i { background: #d99a00; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#bar {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  right: calc(max(16px, env(safe-area-inset-right, 0px)) + 340px);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 14px;
}
.brand { display: flex; gap: 10px; align-items: center; margin-right: auto; min-width: 0; }
.brand b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.mark { width: 26px; height: 26px; flex: none; border-radius: 5px; background: var(--accent); position: relative; }
.mark::before, .mark::after { content: ""; position: absolute; background: var(--accent-ink); }
.mark::before { left: 5px; right: 5px; top: 6px; height: 3px; }
.mark::after { left: 5px; width: 3px; top: 6px; bottom: 4px; box-shadow: 13px 0 0 var(--accent-ink); }
.group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px; }
button {
  font: 500 13px/1 var(--sans); color: var(--ink); background: var(--chip); border: 1px solid transparent;
  padding: 7px 10px; border-radius: 6px; cursor: pointer;
}
button:hover { border-color: var(--line); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
#play { min-width: 74px; font-weight: 600; }

#side {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); width: 320px; display: flex; flex-direction: column; overflow: hidden;
}
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.kpi { padding: 10px 12px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
.kpi:nth-child(4) { border-left: 0; }
.kpi:nth-child(n + 4) { border-top: 1px solid var(--line); }
.kpi label { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.kpi b { font: 600 17px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.kpi small { font: 500 11px var(--mono); color: var(--muted); }
.list { overflow-y: auto; padding: 6px 0 10px; flex: 1; min-height: 0; }
.list h3 {
  margin: 10px 14px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted);
  display: flex; justify-content: space-between;
}
.st {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; align-items: center; width: 100%; text-align: left;
  background: none; border-radius: 0; padding: 6px 14px; font-size: 13px;
}
.st:hover { background: var(--chip); border-color: transparent; }
.st .n { font: 500 11px var(--mono); color: var(--muted); }
.st .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font: 600 10px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 6px; border-radius: 3px; color: #fff; background: var(--idle); }
.chip[data-s="busy"] { background: var(--ok); }
.chip[data-s="blocked"] { background: var(--warn); color: #1a1306; }
.util { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: var(--chip); display: flex; overflow: hidden; }
.util i { display: block; height: 100%; }
.util i:nth-child(1) { background: var(--ok); }
.util i:nth-child(2) { background: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; }
#detail { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); min-height: 3.2em; }
#detail b { color: var(--ink); display: block; font-size: 13px; }

@media (max-width: 760px) {
  #bar { right: max(16px, env(safe-area-inset-right, 0px)); padding: 8px 10px; gap: 8px; }
  .brand span { display: none; }
  #side { top: auto; width: auto; left: max(16px, env(safe-area-inset-left, 0px)); height: 42%; }
  .kpi { padding: 7px 10px; }
  .kpi b { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>

<header class="panel" id="bar">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div><b>Prismatic Module &amp; Pack Line</b><span>12 cells per module · 12 modules per pack</span></div>
  </div>
  <div class="group" role="group" aria-label="Simulation">
    <button id="play" aria-pressed="false">❚❚ Pause</button>
    <button data-speed="5">5×</button>
    <button data-speed="20" aria-pressed="true">20×</button>
    <button data-speed="60">60×</button>
    <button data-speed="180">180×</button>
  </div>
  <div class="group" role="group" aria-label="Camera">
    <label>View</label>
    <button data-view="module" aria-pressed="true">Module line</button>
    <button data-view="pack">Pack line</button>
    <button data-view="yard">Yard</button>
    <button data-view="overview">Overview</button>
    <button id="labels" aria-pressed="true">Labels</button>
  </div>
</header>

<aside class="panel" id="side">
  <div class="kpis">
    <div class="kpi"><label>Sim time</label><b id="k-time">0:00:00</b></div>
    <div class="kpi"><label>Modules</label><b id="k-mod">0</b> <small id="k-modh"></small></div>
    <div class="kpi"><label>Packs</label><b id="k-pack">0</b> <small id="k-packh"></small></div>
    <div class="kpi"><label>Module buffer</label><b id="k-stock">0</b> <small>/ 72</small></div>
    <div class="kpi"><label>Rejects</label><b id="k-rej">0</b></div>
    <div class="kpi"><label>Bottleneck</label><b id="k-bn" style="font-size:13px">—</b></div>
  </div>
  <div class="list" id="list"></div>
  <div id="detail">Select a station to fly to it.</div>
  <div class="legend">
    <span><i style="background:var(--ok)"></i>Working</span>
    <span><i style="background:var(--warn)"></i>Blocked</span>
    <span><i style="background:var(--idle)"></i>Starved</span>
  </div>
</aside>

<script type="module">
import { startBatteryLine } from './src/battery/line.js';

const $ = (s) => document.querySelector(s);
const list = $('#list');
const rows = new Map();
const LABEL = { busy: 'Working', blocked: 'Blocked', idle: 'Starved' };

const api = await startBatteryLine($('#stage'), { onTick: render });

function section(title, sts, takt) {
  const h = document.createElement('h3');
  h.innerHTML = `<span>${title}</span><span>${takt}</span>`;
  list.append(h);
  sts.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'st';
    b.innerHTML = `<span class="n">${String((i + 1) * 10).padStart(3, '0')}</span><span class="nm">${s.name}</span><span class="chip">—</span><span class="util"><i></i><i></i></span>`;
    b.addEventListener('click', () => {
      api.focusStation(s);
      $('#detail').innerHTML = `<b>${s.name}</b>${s.desc} Cycle ${s.cycle} s${s.ops ? ` · ${s.ops} operators` : ''}.`;
      document.querySelectorAll('[data-view]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    });
    list.append(b);
    rows.set(s, { chip: b.querySelector('.chip'), bars: b.querySelectorAll('.util i') });
  });
}
section('Module line', api.modSt, 'cycle ~30 s');
section('Pack line', api.packSt, 'cycle ~5 min');

const hms = (t) => `${Math.floor(t / 3600)}:${String(Math.floor(t / 60) % 60).padStart(2, '0')}:${String(Math.floor(t) % 60).padStart(2, '0')}`;
function render(a) {
  const { sim } = a;
  const h = sim.t / 3600;
  $('#k-time').textContent = hms(sim.t);
  $('#k-mod').textContent = sim.modulesBuilt;
  $('#k-pack').textContent = sim.packsBuilt;
  $('#k-modh').textContent = h > 0.05 ? `${Math.round(sim.modulesBuilt / h)}/h` : '';
  $('#k-packh').textContent = h > 0.2 ? `${(sim.packsBuilt / h).toFixed(1)}/h` : '';
  $('#k-stock').textContent = sim.moduleStock;
  $('#k-rej').textContent = sim.rejects;
  let bn = null;
  for (const [s, r] of rows) {
    r.chip.dataset.s = s.state;
    r.chip.textContent = LABEL[s.state];
    const tot = s.busyT + s.blockedT + s.idleT || 1;
    r.bars[0].style.width = `${(100 * s.busyT) / tot}%`;
    r.bars[1].style.width = `${(100 * s.blockedT) / tot}%`;
    if (sim.t > 120 && (!bn || s.busyT / tot > bn.u)) bn = { s, u: s.busyT / tot };
  }
  $('#k-bn').textContent = bn ? bn.s.name : '—';
}

const play = $('#play');
play.addEventListener('click', () => {
  const on = api.togglePlay();
  play.textContent = on ? '❚❚ Pause' : '▶ Play';
  play.setAttribute('aria-pressed', String(!on));
});
document.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', () => {
  api.setSpeed(+b.dataset.speed);
  document.querySelectorAll('[data-speed]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
  api.setView(b.dataset.view);
  document.querySelectorAll('[data-view]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
const lab = $('#labels');
lab.addEventListener('click', () => {
  const on = lab.getAttribute('aria-pressed') !== 'true';
  lab.setAttribute('aria-pressed', String(on));
  api.setLabels(on);
});
</script>
</body>
</html>
